---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: spark
  namespace: spark-jobs
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: spark-role
  namespace: spark-jobs
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "persistentvolumeclaims", "secrets"]
    verbs: ["*"]
  - apiGroups: [""]
    resources: ["pods/log", "pods/exec"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: spark-role-binding
  namespace: spark-jobs
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: spark-role
subjects:
  - kind: ServiceAccount
    name: spark
    namespace: spark-jobs
---
# RoleBinding в data-platform — чтобы Thrift Service из spark-jobs мог быть достижим,
# а также чтобы driver мог создавать configmaps/secrets для логов в namespace data-platform не нужен —
# driver работает в spark-jobs. Достаточно одной роли в spark-jobs.
