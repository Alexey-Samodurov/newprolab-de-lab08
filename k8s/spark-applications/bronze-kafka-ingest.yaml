---
# Bronze Kafka streaming — long-running.
# NB: применять только когда Kafka реально доступна (см. ADR #24);
# из `make up` этот SparkApp намеренно НЕ применяется — иначе CrashLoop.
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: bronze-kafka-ingest
  namespace: spark-jobs
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: lab08/spark:3.5.8-hudi-1.1.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark/jobs/bronze_kafka_ingest.py"
  # Скрипт читает bootstrap/topic из env ($KAFKA_BOOTSTRAP_SERVERS, $KAFKA_TOPIC)
  # которые подставляются ниже из Secret lab08-credentials.
  arguments: []
  # hudi_utils.py — общий хелпер; явно объявляем чтобы Spark разложил его в sys.path.
  deps:
    pyFiles:
      - "local:///opt/spark/jobs/hudi_utils.py"
  sparkVersion: "3.5.8"
  restartPolicy:
    type: Always
    onFailureRetries: 10
    onFailureRetryInterval: 30
    onSubmissionFailureRetries: 5
    onSubmissionFailureRetryInterval: 30
  sparkConf:
    "spark.sql.catalogImplementation": "hive"
    "spark.sql.warehouse.dir": "s3a://warehouse/"
    "spark.sql.extensions": "org.apache.spark.sql.hudi.HoodieSparkSessionExtension"
    "spark.serializer": "org.apache.spark.serializer.KryoSerializer"
    "spark.kryo.registrator": "org.apache.spark.HoodieSparkKryoRegistrar"
    "spark.sql.catalog.spark_catalog": "org.apache.spark.sql.hudi.catalog.HoodieCatalog"
    "spark.hadoop.hive.metastore.uris": "thrift://hive-metastore.data-platform.svc.cluster.local:9083"
    "spark.hadoop.fs.s3a.endpoint": "http://minio.storage.svc.cluster.local"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.connection.ssl.enabled": "false"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    # AWS_* env vars подставляются в pod из Secret (см. envSecretKeyRefs ниже),
    # никаких хардкоженных ключей в манифесте.
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    "spark.kubernetes.namespace": "spark-jobs"
    "spark.kubernetes.executor.deleteOnTermination": "true"
    "spark.sql.streaming.checkpointLocation": "s3a://hudi/.checkpoints/bronze-kafka"
    # Observability: см. bronze-s3-streaming.yaml — то же.
    "spark.metrics.namespace": "spark"
    "spark.sql.streaming.metricsEnabled": "true"
    "spark.metrics.conf.*.sink.prometheusServlet.class": "org.apache.spark.metrics.sink.PrometheusServlet"
    "spark.metrics.conf.*.sink.prometheusServlet.path": "/metrics/prometheus/"
    "spark.metrics.conf.master.sink.prometheusServlet.path": "/metrics/master/prometheus/"
    "spark.metrics.conf.applications.sink.prometheusServlet.path": "/metrics/applications/prometheus/"
    "spark.metrics.conf.driver.source.jvm.class": "org.apache.spark.metrics.source.JvmSource"
    "spark.metrics.conf.executor.source.jvm.class": "org.apache.spark.metrics.source.JvmSource"
  driver:
    cores: 1
    coreLimit: "2000m"
    memory: "1g"
    serviceAccount: spark
    labels:
      app: bronze-kafka-ingest
    # Hudi metrics OFF — см. spark-jobs/hudi_utils.py / bronze-s3-streaming.yaml.
    envSecretKeyRefs:
      AWS_ACCESS_KEY_ID:
        name: lab08-credentials
        key: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        name: lab08-credentials
        key: AWS_SECRET_ACCESS_KEY
      KAFKA_BOOTSTRAP_SERVERS:
        name: lab08-credentials
        key: KAFKA_BOOTSTRAP_SERVERS
      KAFKA_TOPIC:
        name: lab08-credentials
        key: KAFKA_TOPIC
    volumeMounts:
      - name: jobs-code
        mountPath: /opt/spark/jobs
  executor:
    cores: 1
    instances: 1
    memory: "1g"
    labels:
      app: bronze-kafka-ingest
    envSecretKeyRefs:
      AWS_ACCESS_KEY_ID:
        name: lab08-credentials
        key: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        name: lab08-credentials
        key: AWS_SECRET_ACCESS_KEY
    volumeMounts:
      - name: jobs-code
        mountPath: /opt/spark/jobs
  volumes:
    - name: jobs-code
      configMap:
        name: spark-jobs-code
