---
apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: bootstrap-layer-skeletons
  namespace: spark-jobs
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: lab08/spark:3.5.8-hudi-1.1.1
  imagePullPolicy: IfNotPresent
  mainApplicationFile: "local:///opt/spark/jobs/bootstrap_layer_skeletons.py"
  arguments: []
  sparkVersion: "3.5.8"
  restartPolicy:
    type: OnFailure
    onFailureRetries: 3
    onFailureRetryInterval: 30
    onSubmissionFailureRetries: 3
    onSubmissionFailureRetryInterval: 30
  timeToLiveSeconds: 10
  sparkConf:
    "spark.sql.catalogImplementation": "hive"
    "spark.sql.warehouse.dir": "s3a://lake/warehouse/"
    "spark.sql.extensions": "org.apache.spark.sql.hudi.HoodieSparkSessionExtension"
    "spark.serializer": "org.apache.spark.serializer.KryoSerializer"
    "spark.kryo.registrator": "org.apache.spark.HoodieSparkKryoRegistrar"
    "spark.sql.catalog.spark_catalog": "org.apache.spark.sql.hudi.catalog.HoodieCatalog"
    "spark.hadoop.hive.metastore.uris": "thrift://hive-metastore.data-platform.svc.cluster.local:9083"
    "spark.hadoop.fs.s3a.endpoint": "http://minio.storage.svc.cluster.local"
    "spark.hadoop.fs.s3a.path.style.access": "true"
    "spark.hadoop.fs.s3a.connection.ssl.enabled": "false"
    "spark.hadoop.fs.s3a.impl": "org.apache.hadoop.fs.s3a.S3AFileSystem"
    "spark.hadoop.fs.s3a.aws.credentials.provider": "com.amazonaws.auth.EnvironmentVariableCredentialsProvider"
    "spark.kubernetes.namespace": "spark-jobs"
    "spark.kubernetes.executor.deleteOnTermination": "true"
    "spark.kubernetes.driverEnv.PYTHONPATH": "/opt/spark/jobs"
    "spark.executorEnv.PYTHONPATH": "/opt/spark/jobs"
  driver:
    cores: 1
    coreRequest: "100m"
    memory: "1g"
    serviceAccount: spark
    labels:
      app: bootstrap-layer-skeletons
    envSecretKeyRefs:
      AWS_ACCESS_KEY_ID:
        name: lab08-credentials
        key: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        name: lab08-credentials
        key: AWS_SECRET_ACCESS_KEY
    volumeMounts:
      - name: jobs-code
        mountPath: /opt/spark/jobs
      - name: spark-utils-code
        mountPath: /opt/spark/jobs/utils
  executor:
    cores: 1
    coreRequest: "200m"
    instances: 1
    memory: "1g"
    labels:
      app: bootstrap-layer-skeletons
    envSecretKeyRefs:
      AWS_ACCESS_KEY_ID:
        name: lab08-credentials
        key: AWS_ACCESS_KEY_ID
      AWS_SECRET_ACCESS_KEY:
        name: lab08-credentials
        key: AWS_SECRET_ACCESS_KEY
    volumeMounts:
      - name: jobs-code
        mountPath: /opt/spark/jobs
      - name: spark-utils-code
        mountPath: /opt/spark/jobs/utils
  volumes:
    - name: jobs-code
      configMap:
        name: spark-jobs-code
    - name: spark-utils-code
      configMap:
        name: spark-utils-code
