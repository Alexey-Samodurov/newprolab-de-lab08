apiVersion: v1
kind: Secret
metadata:
  name: lab08-credentials
  namespace: spark-jobs
type: Opaque
stringData:
  s3.endpoint: "http://minio.storage.svc.cluster.local"
  s3.access.key: "minioadmin"
  s3.secret.key: "minioadmin123"
  hms.uris: "thrift://hive-metastore.data-platform.svc.cluster.local:9083"
  # Внешняя Kafka (организаторы)
  kafka.bootstrap: "kafka.ijklmn.xyz:9092"
  kafka.topic: "lab08_transactions"
