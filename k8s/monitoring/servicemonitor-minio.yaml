---
# MinIO Tenant: 3 встроенных prometheus-эндпоинта на порту 9000.
# Нужен MINIO_PROMETHEUS_AUTH_TYPE=public (включён в helm-values/minio-tenant.yaml).
#
# Источники:
#   /minio/v2/metrics/cluster   — cluster-wide: capacity, drives, requests, errors
#   /minio/v2/metrics/node      — per-node: cpu, memory, network, fd
#   /minio/v2/metrics/bucket    — per-bucket: usage, requests
#
# Service `minio` в namespace storage уже создан minio-operator-ом (ClusterIP, port 80→9000).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: minio-tenant
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: lab08-observability
spec:
  namespaceSelector:
    matchNames:
      - storage
  selector:
    matchLabels:
      v1.min.io/tenant: lab08
  endpoints:
    - port: http-minio        # имя порта Service `minio` от minio-operator (port 80 → 9000)
      path: /minio/v2/metrics/cluster
      interval: 30s
      scheme: http
    - port: http-minio
      path: /minio/v2/metrics/node
      interval: 30s
      scheme: http
    - port: http-minio
      path: /minio/v2/metrics/bucket
      interval: 30s
      scheme: http
