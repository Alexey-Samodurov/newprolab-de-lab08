---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: spark-applications
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: lab08-observability
spec:
  namespaceSelector:
    matchNames:
      - spark-jobs
  selector:
    matchLabels:
      sparkoperator.k8s.io/launched-by-spark-operator: "true"
      spark-role: driver
  podMetricsEndpoints:
    - port: spark-ui
      path: /metrics/prometheus/
      interval: 30s
      relabelings:
        - sourceLabels: [__meta_kubernetes_pod_label_sparkoperator_k8s_io_app_name]
          targetLabel: spark_app_name
        - sourceLabels: [__meta_kubernetes_pod_label_spark_role]
          targetLabel: spark_role
