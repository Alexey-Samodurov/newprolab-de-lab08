apiVersion: v1
kind: Service
metadata:
  name: statsd-ingest
  namespace: monitoring
  labels:
    app.kubernetes.io/name: statsd-ingest
    app.kubernetes.io/part-of: lab08-monitoring
  annotations:
    lab08.local/purpose: |
      Stable-ClusterIP fronting prometheus-statsd-exporter pods for UDP ingest.
      Airflow's python statsd client caches DNS resolution at process start,
      so it must talk to a Service whose ClusterIP never changes across helm
      upgrades or pod rescheduling.
spec:
  type: ClusterIP
  clusterIP: 10.96.252.252
  selector:
    app.kubernetes.io/name: prometheus-statsd-exporter
    app.kubernetes.io/instance: prometheus-statsd-exporter
  ports:
    - name: statsd-udp
      port: 9125
      targetPort: statsd-udp
      protocol: UDP
    - name: statsd-tcp
      port: 9125
      targetPort: statsd-tcp
      protocol: TCP
