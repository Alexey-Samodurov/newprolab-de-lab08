# Шаблон секретов для lab08.
#
# Использование:
#   1. cp k8s/secrets.example.yaml k8s/secrets.yaml
#   2. Замени значения placeholder'ов (CHANGE_ME / TODO_*) на реальные.
#   3. make secrets   (или kubectl apply -f k8s/secrets.yaml)
#
# secrets.yaml в .gitignore — реальные значения никогда не коммитятся.
# Здесь хранятся ВСЕ Secret-объекты, нужные lab08; других файлов с секретами быть не должно.
#
# Карта потребителей:
#   lab08-env-configuration  (storage)        → MinIO Tenant root user/password
#                                                (helm-values/minio-tenant.yaml: existingSecret=true)
#   lab08-credentials        (spark-jobs)     → SparkApplications (envSecretKeyRefs)
#                                                Содержит AWS_*, HMS_URIS, KAFKA_*
#                                                hadoop-aws читает AWS_* через
#                                                EnvironmentVariableCredentialsProvider.
#   minio-credentials        (data-platform)  → Hive Metastore Deployment (envFrom)
#                                                hadoop-aws на стороне HMS читает AWS_*.
---
apiVersion: v1
kind: Secret
metadata:
  name: lab08-env-configuration
  namespace: storage
type: Opaque
stringData:
  # MinIO Operator читает этот секрет при создании Tenant и устанавливает root пароль.
  # Должен существовать ДО `helmfile sync` (см. порядок в `make up`: ns → secrets → helmfile).
  config.env: |
    export MINIO_ROOT_USER="minioadmin"
    export MINIO_ROOT_PASSWORD="CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: lab08-credentials
  namespace: spark-jobs
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_ENDPOINT_URL: "http://minio.storage.svc.cluster.local"
  HMS_URIS: "thrift://hive-metastore.data-platform.svc.cluster.local:9083"
  # Внешний Kafka-брокер. Используется только при ручном `make kafka-streaming-app`.
  KAFKA_BOOTSTRAP_SERVERS: "TODO_KAFKA_HOST:9092"
  KAFKA_TOPIC: "lab08_transactions"
---
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: data-platform
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "minioadmin"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME"
  AWS_ENDPOINT_URL: "http://minio.storage.svc.cluster.local"
