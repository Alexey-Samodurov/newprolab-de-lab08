name: 'lab08'
version: '1.0.0'
config-version: 2

profile: 'lab08'

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  lab08:
    silver:
      +materialized: incremental
      +file_format: hudi
      +incremental_strategy: merge
      +schema: silver
      +location_root: s3a://lake/silver
    gold:
      +materialized: table
      +file_format: hudi
      +schema: gold
      +location_root: s3a://lake/gold

vars:
  base_currency: "TGRK"
  # Lookback для инкрементальных моделей отмен.
  # 30 дней покрывает весь период данных + late-arriving cancellations
  # (README: отмена может прийти на следующий день).
  cancellations_lookback_days: 30
