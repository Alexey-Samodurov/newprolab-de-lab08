version: 2

models:
  - name: transactions_by_hour
    columns:
      - name: pk
        tests: [unique, not_null]
      - name: updated_at
        tests: [not_null]
  - name: purchases_by_hour
    columns:
      - name: pk
        tests: [unique, not_null]
      - name: updated_at
        tests: [not_null]
  - name: revenue_daily
    columns:
      - name: event_day
        tests: [unique, not_null]
      - name: updated_at
        tests: [not_null]
  - name: promo_codes_analysis
    columns:
      - name: promo_code_id
        tests: [not_null]
      - name: updated_at
        tests: [not_null]
  - name: cancellations_summary
    columns:
      - name: pk
        tests: [unique, not_null]
      - name: cancel_day
        tests: [not_null]
      - name: reason
        tests: [not_null]
      - name: updated_at
        tests: [not_null]
  - name: user_cohorts
    columns:
      - name: pk
        tests: [unique, not_null]
      - name: event_day
        tests: [not_null]
      - name: user_type
        tests:
          - not_null
          - accepted_values:
              values: ['new', 'returning']
      - name: updated_at
        tests: [not_null]
