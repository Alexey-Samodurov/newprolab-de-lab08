# Spark metrics → Prometheus (PrometheusServlet built-in sink).
#
# PrometheusServlet — нативный sink Spark 3.x, висит на том же HTTP-порту, что и
# Spark UI. Активируется только конфигом — никаких jar-зависимостей не нужно.
#
# Endpoints:
#   driver       :4040 /metrics/prometheus/
#   master       :8080 /metrics/master/prometheus/   (standalone — не используется в K8s)
#   applications :8080 /metrics/applications/prometheus/
#
# Executor pod-ы НЕ открывают свой HTTP — их метрики Spark публикует через driver
# в /metrics/executors/prometheus/ и /metrics/applications/prometheus/. Поэтому
# PodMonitor скрейпит только driver-pod-ы (см. k8s/monitoring/podmonitor-spark-applications.yaml).
#
# JmxSource подтягивается отдельно — он нужен для Hudi-метрик
# (hoodie.metrics.reporter.type=JMX публикует в JMX → JmxSink → PrometheusServlet).

# ── Sinks ──────────────────────────────────────────────────────────────────────
*.sink.prometheusServlet.class=org.apache.spark.metrics.sink.PrometheusServlet
*.sink.prometheusServlet.path=/metrics/prometheus/
master.sink.prometheusServlet.path=/metrics/master/prometheus/
applications.sink.prometheusServlet.path=/metrics/applications/prometheus/

# ── Sources ────────────────────────────────────────────────────────────────────
# JVM heap, GC, threads — для driver и для executor (executor-метрики пробрасываются
# через driver и попадут в общий /metrics/prometheus/).
driver.source.jvm.class=org.apache.spark.metrics.source.JvmSource
executor.source.jvm.class=org.apache.spark.metrics.source.JvmSource
