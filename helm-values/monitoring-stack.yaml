# kube-prometheus-stack — единый блок observability lab08.
# https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
#
# Что включено:
#   - Prometheus (retention 1d, PVC 5Gi)
#   - Grafana (admin/admin, sidecar для авто-импорта дашбордов из ConfigMap)
#   - Alertmanager — поднимается, но без user-rules (по требованию)
#   - kube-state-metrics — для общих кластерных метрик (Pod restarts и т.п.)
#   - node-exporter ОТКЛЮЧЁН — лаб локальный, hardware-метрики не нужны
#   - Прочие компоненты (kubeApiServer, kubeControllerManager, etcd, scheduler) ОТКЛЮЧЕНЫ —
#     в kind/Docker Desktop они или недоступны, или генерируют шум
#
# ServiceMonitor/PodMonitor для наших источников (spark-operator, sparkapps,
# minio, airflow-statsd) — кладутся отдельными манифестами в k8s/monitoring/.
# Чтобы Prometheus их подхватил, отключаем фильтрацию по releaseLabel.

fullnameOverride: kps

# ── Prometheus ────────────────────────────────────────────────────────────────
prometheus:
  prometheusSpec:
    retention: 1d
    retentionSize: "4GB"
    scrapeInterval: 30s
    evaluationInterval: 30s
    # Подхватывать ВСЕ ServiceMonitor/PodMonitor в кластере (не только с label release=kps)
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    probeSelectorNilUsesHelmValues: false
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 5Gi
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: 500m
        memory: 1Gi

# ── Grafana ───────────────────────────────────────────────────────────────────
grafana:
  adminUser: admin
  adminPassword: admin
  defaultDashboardsEnabled: true   # стандартные k8s/node дашборды — полезно как baseline
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    datasources:
      enabled: true
  persistence:
    enabled: false   # дашборды доставляются как код через ConfigMap, persistence не нужен
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi
  service:
    type: ClusterIP

# ── Alertmanager ──────────────────────────────────────────────────────────────
# Ставится в дефолте; алёртов не настраиваем — просто доступен на случай ad-hoc.
alertmanager:
  enabled: true
  alertmanagerSpec:
    retention: 24h
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ── Лишние компоненты выключаем ───────────────────────────────────────────────
nodeExporter:
  enabled: false
prometheus-node-exporter:
  enabled: false

kubeApiServer:
  enabled: true
kubelet:
  enabled: true
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
kubeEtcd:
  enabled: false

defaultRules:
  create: false   # дефолтные алёрты (CPUThrottlingHigh и т.п.) не создаём — алёрты вне scope

# kube-state-metrics — оставляем дефолт; лёгкий, нужен для kube_pod_*, kube_deployment_* метрик
kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
