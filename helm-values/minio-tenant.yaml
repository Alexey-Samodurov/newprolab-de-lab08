tenant:
  name: lab08
  configuration:
    name: lab08-env-configuration
  configSecret:
    name: lab08-env-configuration
    existingSecret: true
    accessKey: ""
    secretKey: ""
  pools:
    - servers: 1
      name: pool-0
      volumesPerServer: 1
      size: 20Gi
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 1
          memory: 2Gi
  certificate:
    requestAutoCert: false
  buckets:
    - name: lake
    - name: checkpoints
    - name: artifacts
  features:
    bucketDNS: false
    domains: {}
  env:
    - name: MINIO_PROMETHEUS_AUTH_TYPE
      value: "public"

ingress:
  api:
    enabled: false
  console:
    enabled: false
