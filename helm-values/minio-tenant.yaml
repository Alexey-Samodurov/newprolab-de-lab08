# MinIO Tenant — локальное S3-совместимое хранилище для Hudi data lake.
# https://github.com/minio/operator/tree/master/helm/tenant
tenant:
  name: lab08
  configuration:
    name: lab08-env-configuration
  configSecret:
    name: lab08-env-configuration
    # existingSecret: true — секрет создаётся из k8s/secrets.yaml ДО helmfile sync,
    # helm chart НЕ перезаписывает его своими значениями.
    existingSecret: true
    # При existingSecret=true accessKey/secretKey ДОЛЖНЫ быть пустыми, иначе chart
    # падает с "cannot set access-key when an existing secret is used".
    accessKey: ""
    secretKey: ""
  pools:
    - servers: 1
      name: pool-0
      volumesPerServer: 1
      size: 20Gi
      # storageClassName подставится из default StorageClass kind/Docker Desktop
      resources:
        requests:
          cpu: 200m
          memory: 1Gi
        limits:
          cpu: 1
          memory: 2Gi
  certificate:
    requestAutoCert: false
  buckets:
    - name: lake          # bronze/silver/gold Hudi tables + HMS warehouse (s3a://lake/warehouse/)
    - name: checkpoints   # streaming чекпойнты (Spark Structured Streaming)
    - name: artifacts     # spark logs, dbt manifests, airflow remote logs, DAG-файлы
  features:
    bucketDNS: false
    domains: {}
  # Публичный prometheus-эндпоинт (без JWT) — нужен для скрейпа Prometheus-ом без секрета.
  # MinIO экспонирует /minio/v2/metrics/{cluster,node,bucket,resource} на порту 9000.
  env:
    - name: MINIO_PROMETHEUS_AUTH_TYPE
      value: "public"

ingress:
  api:
    enabled: false
  console:
    enabled: false
