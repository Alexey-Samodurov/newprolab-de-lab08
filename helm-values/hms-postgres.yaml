image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 16.4.0-debian-12-r14

auth:
  username: hive
  password: hive
  database: metastore

primary:
  persistence:
    size: 5Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

fullnameOverride: hive-metastore-postgresql

primary.service.ports.postgresql: 5432
