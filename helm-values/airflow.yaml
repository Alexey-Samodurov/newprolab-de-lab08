executor: KubernetesExecutor

airflowVersion: "2.10.4"

defaultAirflowTag: "2.10.4"

dags:
  persistence:
    enabled: false
  gitSync:
    enabled: false

postgresql:
  enabled: false

data:
  metadataConnection:
    user: airflow
    pass: airflow
    protocol: postgresql
    host: postgres.data-platform.svc.cluster.local
    port: 5432
    db: airflow
    sslmode: disable

redis:
  enabled: false

extraEnv: |
  - name: AIRFLOW__CORE__LOAD_EXAMPLES
    value: "False"
  - name: AIRFLOW__KUBERNETES_EXECUTOR__NAMESPACE
    value: "data-platform"
  - name: AIRFLOW__SCHEDULER__DAG_DIR_LIST_INTERVAL
    value: "30"
  - name: AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL
    value: "15"
  - name: AIRFLOW__METRICS__STATSD_ON
    value: "True"
  - name: AIRFLOW__METRICS__STATSD_HOST
    value: "10.96.252.252"
  - name: AIRFLOW__METRICS__STATSD_PORT
    value: "9125"
  - name: AIRFLOW__METRICS__STATSD_PREFIX
    value: "airflow"
  - name: AIRFLOW__LOGGING__REMOTE_LOGGING
    value: "True"
  - name: AIRFLOW__LOGGING__REMOTE_BASE_LOG_FOLDER
    value: "s3://artifacts/airflow-logs"
  - name: AIRFLOW__LOGGING__REMOTE_LOG_CONN_ID
    value: "minio_s3"
  - name: AIRFLOW__LOGGING__ENCRYPT_S3_LOGS
    value: "False"
  - name: AIRFLOW_CONN_MINIO_S3
    value: "aws://minioadmin:minioadmin123@/?endpoint_url=http%3A%2F%2Fminio.storage.svc.cluster.local&region_name=us-east-1"
  - name: AIRFLOW_CONN_TRINO_DEFAULT
    value: "trino://airflow@trino.data-platform.svc.cluster.local:8080/hudi"

images:
  airflow:
    repository: lab08/airflow
    tag: 2.10.4
    pullPolicy: IfNotPresent

createUserJob:
  useHelmHooks: false
  applyCustomEnv: false

migrateDatabaseJob:
  useHelmHooks: false
  applyCustomEnv: false

_dagsExtraVolumes: &dagsExtraVolumes
  - name: dags
    emptyDir: {}

_dagsExtraVolumeMounts: &dagsExtraVolumeMounts
  - name: dags
    mountPath: /opt/airflow/dags

_dagsInitContainers: &dagsInitContainers
  - name: dag-init
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    env:
      - name: MC_CONFIG_DIR
        value: /tmp/.mc
      - name: HOME
        value: /tmp
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        cpu: 200m
        memory: 128Mi
    command:
      - sh
      - -c
      - |
        set -e
        mc alias set minio http://minio.storage.svc.cluster.local minioadmin minioadmin123
        mkdir -p /opt/airflow/dags
        mc mirror --overwrite --remove minio/artifacts/dags /opt/airflow/dags || true
        ls -R /opt/airflow/dags
    volumeMounts:
      - name: dags
        mountPath: /opt/airflow/dags

_dagsSyncSidecar: &dagsSyncSidecar
  - name: dag-sync
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    env:
      - name: MC_CONFIG_DIR
        value: /tmp/.mc
      - name: HOME
        value: /tmp
    resources:
      requests:
        cpu: 25m
        memory: 48Mi
      limits:
        cpu: 200m
        memory: 128Mi
    command:
      - sh
      - -c
      - |
        set -e
        mc alias set minio http://minio.storage.svc.cluster.local minioadmin minioadmin123
        while true; do
          mc mirror --overwrite --remove minio/artifacts/dags /opt/airflow/dags >/dev/null 2>&1 || true
          sleep 15
        done
    volumeMounts:
      - name: dags
        mountPath: /opt/airflow/dags

scheduler:
  resources:
    requests:
      cpu: 150m
      memory: 640Mi
    limits:
      cpu: 1
      memory: 1536Mi
  extraVolumes: *dagsExtraVolumes
  extraVolumeMounts: *dagsExtraVolumeMounts
  extraInitContainers: *dagsInitContainers
  extraContainers: *dagsSyncSidecar

webserver:
  resources:
    requests:
      cpu: 100m
      memory: 640Mi
    limits:
      cpu: 1
      memory: 1536Mi
  defaultUser:
    enabled: true
    role: Admin
    username: admin
    password: admin
  extraVolumes: *dagsExtraVolumes
  extraVolumeMounts: *dagsExtraVolumeMounts
  extraInitContainers: *dagsInitContainers
  extraContainers: *dagsSyncSidecar

triggerer:
  enabled: true
  resources:
    requests:
      cpu: 50m
      memory: 384Mi
    limits:
      cpu: 500m
      memory: 768Mi
  extraVolumes: *dagsExtraVolumes
  extraVolumeMounts: *dagsExtraVolumeMounts
  extraInitContainers: *dagsInitContainers
  extraContainers: *dagsSyncSidecar

workers:
  resources:
    requests:
      cpu: 50m
      memory: 192Mi
    limits:
      cpu: 500m
      memory: 768Mi
  extraVolumes: *dagsExtraVolumes
  extraVolumeMounts: *dagsExtraVolumeMounts
  extraInitContainers: *dagsInitContainers
